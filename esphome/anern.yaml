uart:
  id: uart_2
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  # most devices use 2400 as baud_rate. (110,300,600,1200,2400,4800,9600,14400,19200,38400)
  baud_rate: 2400
