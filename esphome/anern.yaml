esphome:
  name: anern

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "doE2t4GPxY5/aTiJRngXzurVRZzZh5WTXJVdQvHd6Eo="

ota:
  password: "1"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Anern Fallback Hotspot"
    password: "mKnVsGrs5qdZ"

captive_portal:
# Example configuration entry
web_server:
  port: 80  
substitutions:
  name: anern
  friendly_name: Anern
  tx_pin: GPIO1
  rx_pin: GPIO3
